services:
  konomitv:
    image: ghcr.io/tsukumijima/konomitv:latest@sha256:1b90e514f0b9c68a20b5227dddf2d4fbbed17b3f1eb7151a2bd52b75815e58ca
    restart: unless-stopped
    volumes:
      - ./config.yaml:/code/config.yaml
      - ./server/data/:/code/server/data/
      - ./server/logs/:/code/server/logs/
      - ./data/:/host-rootfs/
      - ./server.crt:/server.crt
      - ./server.key:/server.key
    devices:
      - /dev/dri:/dev/dri
    extra_hosts:
      - "edcb-server:${EDCB_IP}"
    ports:
      - "9999:9999"
    group_add:
      - "105" # render group
      - "44" # video group
    networks:
      - default
      - cftunnel
  tunnel:
    image: cloudflare/cloudflared@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    restart: always
    networks:
      - cftunnel
    command: tunnel run --token ${TUNNEL_TOKEN}
networks:
  cftunnel:
    enable_ipv6: true
